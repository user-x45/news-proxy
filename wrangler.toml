name = "news-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# お知らせの保存先。id は `npx wrangler kv namespace create NOTICES` の出力に置き換える
[[kv_namespaces]]
binding = "NOTICES"
id = "e796bdf5f1fc469a83755a99324825ee"

# 見守りカメラの接続仲介(WebRTCの信号中継)。合言葉は不要
[[durable_objects.bindings]]
name = "CAM"
class_name = "Cam"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Cam"]
